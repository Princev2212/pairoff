<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C0F"/>
      <stop offset="50%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8B89A"/>
      <stop offset="100%" stop-color="#E2D7C3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="720" height="50" rx="4" fill="#181820" stroke="#252530" stroke-width="1"/>
  <rect x="60" y="55" width="20" height="20" rx="4" fill="#C8B89A" opacity="0.2"/>
  <text x="70" y="69" fill="#C8B89A" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">XYZ</text>
  <text x="95" y="69" fill="#E4E3EA" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">XYZ INTERNATIONAL SCHOOL</text>
  <rect x="640" y="52" width="100" height="26" rx="3" fill="#C8B89A" opacity="0.9"/>
  <text x="690" y="69" fill="#0C0C0F" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ENQUIRE</text>

  <!-- Hero Content -->
  <rect x="40" y="120" width="440" height="24" rx="3" fill="#181820" stroke="#C8B89A" stroke-opacity="0.3" stroke-width="1"/>
  <text x="55" y="136" fill="#C8B89A" font-family="monospace" font-size="11">ADMISSIONS OPEN FOR ACADEMIC YEAR 2026-27</text>
  
  <text x="40" y="195" fill="#FAF9F6" font-family="serif" font-size="28" font-weight="600">Fostering Intellectual Curiosity</text>
  <text x="40" y="235" fill="#FAF9F6" font-family="serif" font-size="28" font-weight="600">&amp; Lifelong Leadership.</text>
  
  <text x="40" y="275" fill="#9494A6" font-family="sans-serif" font-size="13" font-weight="300">A holistic environment built for academic rigour, scientific inquiry and creative arts.</text>

  <rect x="40" y="315" width="140" height="38" rx="3" fill="url(#champagne)"/>
  <text x="110" y="339" fill="#0C0C0F" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Explore Programs</text>

  <rect x="195" y="315" width="140" height="38" rx="3" fill="#181820" stroke="#252530" stroke-width="1"/>
  <text x="265" y="339" fill="#C2C2CE" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Virtual Tour</text>

  <!-- Tiers -->
  <rect x="40" y="390" width="225" height="70" rx="4" fill="#121217" stroke="#1F1F28" stroke-width="1"/>
  <text x="60" y="415" fill="#C8B89A" font-family="monospace" font-size="10">PRIMARY SCHOOL</text>
  <text x="60" y="438" fill="#E4E3EA" font-family="sans-serif" font-size="13" font-weight="500">Foundational Inquiry</text>

  <rect x="287" y="390" width="225" height="70" rx="4" fill="#121217" stroke="#1F1F28" stroke-width="1"/>
  <text x="307" y="415" fill="#C8B89A" font-family="monospace" font-size="10">MIDDLE SCHOOL</text>
  <text x="307" y="438" fill="#E4E3EA" font-family="sans-serif" font-size="13" font-weight="500">Core Sciences &amp; Arts</text>

  <rect x="535" y="390" width="225" height="70" rx="4" fill="#121217" stroke="#1F1F28" stroke-width="1"/>
  <text x="555" y="415" fill="#C8B89A" font-family="monospace" font-size="10">SENIOR SECONDARY</text>
  <text x="555" y="438" fill="#E4E3EA" font-family="sans-serif" font-size="13" font-weight="500">University Preparedness</text>

  <!-- Graphic Architectural Elements -->
  <circle cx="640" cy="220" r="90" fill="#C8B89A" opacity="0.05" stroke="#C8B89A" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="640" cy="220" r="60" fill="none" stroke="#C8B89A" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
