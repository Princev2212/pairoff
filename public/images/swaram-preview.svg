<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="swaramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080B"/>
      <stop offset="60%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4C5A9"/>
      <stop offset="100%" stop-color="#FAF0DF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#swaramBg)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="720" height="50" rx="4" fill="#13131A" stroke="#1F1F2A" stroke-width="1"/>
  <circle cx="70" cy="65" r="12" fill="#D4C5A9" opacity="0.2"/>
  <text x="70" y="69" fill="#D4C5A9" font-family="serif" font-size="11" font-weight="bold" text-anchor="middle">S</text>
  <text x="95" y="69" fill="#E4E3EA" font-family="serif" font-size="12" font-weight="600" letter-spacing="2">SWARAM MUSIC ACADEMY</text>
  <rect x="640" y="52" width="100" height="26" rx="3" fill="#D4C5A9" opacity="0.9"/>
  <text x="690" y="69" fill="#0C0C0F" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TRIAL LESSON</text>

  <!-- Hero Content -->
  <rect x="40" y="120" width="410" height="24" rx="3" fill="#181822" stroke="#D4C5A9" stroke-opacity="0.3" stroke-width="1"/>
  <text x="55" y="136" fill="#D4C5A9" font-family="monospace" font-size="11">CLASSICAL &amp; CONTEMPORARY INSTRUMENTAL STUDIES</text>
  
  <text x="40" y="195" fill="#FAF9F6" font-family="serif" font-size="28" font-weight="normal">Where Tradition Meets</text>
  <text x="40" y="235" fill="#FAF9F6" font-family="serif" font-size="28" font-weight="normal">Musical Mastery.</text>
  
  <text x="40" y="275" fill="#9494A6" font-family="sans-serif" font-size="13" font-weight="300">Immersive one-on-one mentorship in Carnatic, Hindustani, Western Classical, Veena &amp; Piano.</text>

  <rect x="40" y="315" width="140" height="38" rx="3" fill="url(#gold)"/>
  <text x="110" y="339" fill="#0C0C0F" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Explore Courses</text>

  <rect x="195" y="315" width="140" height="38" rx="3" fill="#181822" stroke="#252535" stroke-width="1"/>
  <text x="265" y="339" fill="#C2C2CE" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Student Recitals</text>

  <!-- Disciplines -->
  <rect x="40" y="390" width="168" height="70" rx="4" fill="#0F0F15" stroke="#1C1C26" stroke-width="1"/>
  <text x="124" y="415" fill="#D4C5A9" font-family="monospace" font-size="10" text-anchor="middle">VOCAL</text>
  <text x="124" y="438" fill="#E4E3EA" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Carnatic / Western</text>

  <rect x="224" y="390" width="168" height="70" rx="4" fill="#0F0F15" stroke="#1C1C26" stroke-width="1"/>
  <text x="308" y="415" fill="#D4C5A9" font-family="monospace" font-size="10" text-anchor="middle">STRINGS</text>
  <text x="308" y="438" fill="#E4E3EA" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Violin / Guitar</text>

  <rect x="408" y="390" width="168" height="70" rx="4" fill="#0F0F15" stroke="#1C1C26" stroke-width="1"/>
  <text x="492" y="415" fill="#D4C5A9" font-family="monospace" font-size="10" text-anchor="middle">PERCUSSION</text>
  <text x="492" y="438" fill="#E4E3EA" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Mridangam / Drums</text>

  <rect x="592" y="390" width="168" height="70" rx="4" fill="#0F0F15" stroke="#1C1C26" stroke-width="1"/>
  <text x="676" y="415" fill="#D4C5A9" font-family="monospace" font-size="10" text-anchor="middle">KEYS</text>
  <text x="676" y="438" fill="#E4E3EA" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Piano / Synth</text>

  <!-- Acoustic wave graphic elements -->
  <path d="M 520 200 Q 560 160 600 200 T 680 200 T 760 200" fill="none" stroke="#D4C5A9" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M 540 220 Q 580 180 620 220 T 700 220 T 780 220" fill="none" stroke="#D4C5A9" stroke-opacity="0.15" stroke-width="1.5"/>
</svg>
